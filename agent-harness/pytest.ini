[pytest]
; importlib mode is REQUIRED here (applied via addopts because pytest 9 does not
; accept `importmode` as an ini key). The harness subpackage is named `datus`
; (cli_anything/datus), which collides with the real top-level `datus` package:
; in the default `prepend` mode pytest inserts the namespace parent
; (`cli_anything/`) onto sys.path, so `import datus` would resolve to the harness
; subpackage instead of the real Datus framework. importlib mode avoids that.
testpaths = cli_anything/datus/tests
addopts = --import-mode=importlib -q
